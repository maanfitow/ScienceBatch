name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libfontconfig-dev \
            libharfbuzz-dev \
            libicu-dev \
            libssl-dev \
            pkg-config

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux bundles (.deb, .AppImage)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: pnpm tauri build --bundles deb,appimage

      - name: Stage Linux release artifacts
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          ls -la release-assets

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sciencebatch-linux-x64
          path: release-assets/*
          if-no-files-found: error

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            ${{ runner.temp }}\vcpkg-archives
          key: ${{ runner.os }}-vcpkg-x64-windows-static-md-fontconfig-freetype-harfbuzz-graphite2-icu-v1

      - name: Setup vcpkg dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $archiveDir = Join-Path $env:RUNNER_TEMP "vcpkg-archives"
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $archiveDir
          & "$vcpkgRoot\vcpkg.exe" install fontconfig freetype 'harfbuzz[graphite2]' icu --triplet x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "TECTONIC_DEP_BACKEND=vcpkg`nVCPKGRS_TRIPLET=x64-windows-static-md`nVCPKG_ROOT=$vcpkgRoot`n"
          )

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows bundles (.exe, .msi)
        run: pnpm tauri build --bundles "nsis,msi"

      - name: Stage Windows installers and portable zip
        shell: pwsh
        run: |
          $releaseAssets = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          $portableStage = Join-Path $env:RUNNER_TEMP "portable-stage"
          New-Item -ItemType Directory -Force -Path $releaseAssets, $portableStage | Out-Null

          Copy-Item -Path "src-tauri/target/release/bundle/nsis/*.exe" -Destination $releaseAssets -Force
          Copy-Item -Path "src-tauri/target/release/bundle/msi/*.msi" -Destination $releaseAssets -Force

          Copy-Item -Path "src-tauri/target/release/sciencebatch.exe" -Destination $portableStage -Force
          Copy-Item -Path "src-tauri/target/release/sciencebatch-cli.exe" -Destination $portableStage -Force

          $refLabel = "${{ github.ref_name }}" -replace '[^A-Za-z0-9._-]', '-'
          $zipPath = Join-Path $releaseAssets "ScienceBatch-$refLabel-windows-x64-portable.zip"
          Compress-Archive -Path "$portableStage/*" -DestinationPath $zipPath -Force

          Get-ChildItem -Path $releaseAssets

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sciencebatch-windows-x64
          path: release-assets/*
          if-no-files-found: error

  release:
    name: Checksums & GitHub Release
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-24.04

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd release-artifacts
          sha256sum * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt ./SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload SHA256SUMS.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: release-artifacts/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
