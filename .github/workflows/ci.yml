name: CI

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
          - os: windows-latest
            rust_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libxdo-dev \
            libfontconfig-dev \
            libharfbuzz-dev \
            libicu-dev \
            libssl-dev \
            pkg-config

      - name: Cache vcpkg packages (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            ${{ runner.temp }}\vcpkg-archives
          key: ${{ runner.os }}-vcpkg-x64-windows-static-md-fontconfig-freetype-harfbuzz-graphite2-icu-v1

      - name: Setup vcpkg dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:\vcpkg" }
          if (-not (Test-Path "$vcpkgRoot\vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $archiveDir = Join-Path $env:RUNNER_TEMP "vcpkg-archives"
          New-Item -ItemType Directory -Force -Path $archiveDir | Out-Null
          $env:VCPKG_DEFAULT_BINARY_CACHE = $archiveDir
          & "$vcpkgRoot\vcpkg.exe" install fontconfig freetype 'harfbuzz[graphite2]' icu --triplet x64-windows-static-md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "TECTONIC_DEP_BACKEND=vcpkg`nVCPKGRS_TRIPLET=x64-windows-static-md`nVCPKG_ROOT=$vcpkgRoot`n"
          )

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        run: pnpm tsc --noEmit

      - name: Build frontend
        run: pnpm build

      - name: Check Rust workspace
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Run Rust library tests
        env:
          TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
          SCIENCEBATCH_WINDOWS_TEST_MANIFEST: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Run frontend verification scripts
        run: |
          node scripts/test-writing-tools.mjs
          node scripts/test-text-formatting.mjs
          node scripts/test-typst-writing-tools.mjs
          node scripts/test-pdf-rendering-helpers.mjs
          node scripts/test-editor-clipboard.mjs
